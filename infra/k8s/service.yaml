apiVersion: v1
kind: Service
metadata:
  name: mcp-aiops-backend
  namespace: default
  labels:
    app.kubernetes.io/name: mcp-aiops-backend
    app.kubernetes.io/part-of: aiops-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "80"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-aiops-backend
  ports:
    - name: http
      port: 80
      targetPort: http
