apiVersion: batch/v1
kind: CronJob
metadata:
  name: mcp-aiops-daily-report
  namespace: default
  labels:
    app.kubernetes.io/name: mcp-aiops-backend
    app.kubernetes.io/part-of: aiops-platform
    app.kubernetes.io/component: ops-report
spec:
  schedule: "0 9 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mcp-aiops-backend
            app.kubernetes.io/part-of: aiops-platform
            app.kubernetes.io/component: ops-report
        spec:
          serviceAccountName: mcp-aiops-backend
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ops-report-runner
              image: REPLACE_IMAGE
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "aiops_platform.ops_reports.job_runner"]
              args: ["daily"]
              envFrom:
                - configMapRef:
                    name: mcp-aiops-backend-config
                - secretRef:
                    name: mcp-aiops-backend-secret
              env:
                - name: OPS_REPORT_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
---
