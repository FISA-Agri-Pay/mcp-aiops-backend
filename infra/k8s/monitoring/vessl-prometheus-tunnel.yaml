# Apply this manifest to the AWS EKS cluster where Grafana runs.
#
# Prerequisite, create this Secret outside Git:
# kubectl create secret generic vessl-llm-ssh-key \
#   -n monitoring \
#   --from-file=id_ed25519=/path/to/kkpp-llm-server-ver1.pem
#
# The tunnel keeps VESSL Prometheus private. Grafana reads it through the
# ClusterIP service below:
# http://vessl-prometheus.monitoring.svc.cluster.local:9090
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vessl-prometheus-tunnel
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vessl-prometheus-tunnel
    app.kubernetes.io/part-of: aiops-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vessl-prometheus-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vessl-prometheus-tunnel
        app.kubernetes.io/part-of: aiops-observability
    spec:
      containers:
        - name: ssh-tunnel
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              apk add --no-cache openssh-client
              cp /ssh/id_ed25519 /tmp/id_ed25519
              chmod 600 /tmp/id_ed25519
              exec ssh -N -g \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=3 \
                -o ExitOnForwardFailure=yes \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -i /tmp/id_ed25519 \
                -p 31541 \
                -L 0.0.0.0:9090:127.0.0.1:9090 \
                root@deneb.cloud.vessl.ai
          ports:
            - name: prometheus
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: prometheus
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/ready
              port: prometheus
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: ssh-key
              mountPath: /ssh
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: vessl-llm-ssh-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: vessl-prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vessl-prometheus-tunnel
    app.kubernetes.io/part-of: aiops-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vessl-prometheus-tunnel
  ports:
    - name: prometheus
      port: 9090
      targetPort: prometheus
      protocol: TCP
