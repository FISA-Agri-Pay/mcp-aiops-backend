# Apply this manifest to the AWS EKS cluster where mcp-aiops-backend runs.
#
# Prerequisite, create this Secret outside Git:
# kubectl create secret generic vessl-llm-ssh-key \
#   -n aiops \
#   --from-file=id_ed25519=/path/to/kkpp-llm-server-ver1.pem
#
# AIOps backend can call:
# http://vessl-vllm-api.aiops.svc.cluster.local:8000/v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vessl-vllm-api-tunnel
  namespace: aiops
  labels:
    app.kubernetes.io/name: vessl-vllm-api-tunnel
    app.kubernetes.io/part-of: aiops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vessl-vllm-api-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vessl-vllm-api-tunnel
        app.kubernetes.io/part-of: aiops-platform
    spec:
      containers:
        - name: ssh-tunnel
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              apk add --no-cache openssh-client
              cp /ssh/id_ed25519 /tmp/id_ed25519
              chmod 600 /tmp/id_ed25519
              exec ssh -N -g \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=3 \
                -o ExitOnForwardFailure=yes \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -i /tmp/id_ed25519 \
                -p 31541 \
                -L 0.0.0.0:8000:127.0.0.1:8000 \
                root@deneb.cloud.vessl.ai
          ports:
            - name: vllm-api
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/models
              port: vllm-api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/models
              port: vllm-api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: ssh-key
              mountPath: /ssh
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: vessl-llm-ssh-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: vessl-vllm-api
  namespace: aiops
  labels:
    app.kubernetes.io/name: vessl-vllm-api-tunnel
    app.kubernetes.io/part-of: aiops-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vessl-vllm-api-tunnel
  ports:
    - name: vllm-api
      port: 8000
      targetPort: vllm-api
      protocol: TCP
